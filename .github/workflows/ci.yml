name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debian:
    name: Build + unit tests (Debian 13)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential clang make pkg-config \
            gnustep-make gnustep-base-runtime \
            libgnustep-base-dev libgnustep-gui-dev \
            libobjc4 libobjc-14-dev \
            libwpewebkit-2.0-dev libwpe-1.0-dev libwpebackend-fdo-1.0-dev \
            libsoup-3.0-dev libxkbcommon-dev \
            python3 ca-certificates \
            git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: ./configure

      - name: Build framework + demo
        shell: bash
        run: |
          . /usr/share/GNUstep/Makefiles/GNUstep.sh \
            || . /usr/GNUstep/System/Library/Makefiles/GNUstep.sh
          make

      - name: Run unit tests
        shell: bash
        run: |
          . /usr/share/GNUstep/Makefiles/GNUstep.sh \
            || . /usr/GNUstep/System/Library/Makefiles/GNUstep.sh
          make -C Tests/Unit run

      - name: Show build artifacts
        run: |
          ls -la Source/obj/ || true
          ls -la Demo/WebKitDemo.app/ || true

  build-ubuntu:
    name: Build + unit tests (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang make pkg-config \
            gnustep-make gnustep-base-runtime \
            libgnustep-base-dev libgnustep-gui-dev \
            libwpewebkit-1.1-dev libwpe-1.0-dev libwpebackend-fdo-1.0-dev \
            python3 ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: ./configure || true

      - name: Build framework
        shell: bash
        run: |
          . /usr/share/GNUstep/Makefiles/GNUstep.sh \
            || . /usr/GNUstep/System/Library/Makefiles/GNUstep.sh
          make -C Source || true

      - name: Run unit tests
        shell: bash
        run: |
          . /usr/share/GNUstep/Makefiles/GNUstep.sh \
            || . /usr/GNUstep/System/Library/Makefiles/GNUstep.sh
          make -C Tests/Unit run || true
